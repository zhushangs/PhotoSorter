name: PhotoSorter
options:
  bundleIdPrefix: com.shang
  deploymentTarget:
    iOS: "17.0"
targets:
  PhotoSorter:
    type: application
    platform: iOS
    sources:
      - PhotoSorter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shang.photosorter
        PRODUCT_NAME: PhotoSorter
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 理片
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 理片需要访问你的照片，才能显示未分类的照片并把它们放进相册。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
