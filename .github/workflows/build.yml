name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project PhotoSorter.xcodeproj \
            -target PhotoSorter \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log || {
              # Show each compiler error on the run's summary page.
              grep -E "error:" build.log | sort -u | head -20 | while IFS= read -r line; do
                echo "::error::${line}"
              done
              exit 1
            }

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/PhotoSorter.app Payload/
          zip -qry PhotoSorter.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSorter-ipa
          path: PhotoSorter.ipa
